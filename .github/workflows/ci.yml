name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Unit and integration tests
        run: npm test

      - name: Harness scenario evals
        run: npm run evals

      - name: Validate agents, contracts, skills, MCP
        run: npm run validate:all

      - name: Generated files are in sync (subagents, plugin)
        run: npm run validate:subagents && npm run check:plugin

      - name: Package contents
        run: npm pack --dry-run

      - name: Real browser validation (6 viewports, vitals, axe)
        run: npm run test:browser

      - name: Monotonic quality ratchets
        run: npm run ratchet

      - name: Quality gates G1-G13
        run: npm run gate

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: examples/sample-website/reports/browser-qa/
          if-no-files-found: ignore
